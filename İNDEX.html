<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Köşkte Katil — Online Feign Tarzı Oyun</title>
<style>
:root{
  --bg:#1b2a2c;        /* gece köşkü, koyu yeşil-mavi */
  --bg2:#233538;
  --line:#3a4f52;
  --paper:#efe6d2;     /* davetiye kağıdı */
  --ink:#2a2118;
  --text:#e9e2d0;
  --mute:#9fb0aa;
  --candle:#e5b567;    /* mum ışığı */
  --blood:#c2453a;
  --sage:#6fae8c;
  --joker:#d79a3a;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(circle at 20% 0%,#27403f 0,transparent 55%),radial-gradient(circle at 100% 100%,#2b2a2a 0,transparent 45%);
  background-attachment:fixed;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Palatino Linotype",Palatino,serif;font-weight:700;letter-spacing:.2px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:.65rem 1rem;background:var(--candle);color:var(--ink);font-weight:600}
button:hover{filter:brightness(1.07)}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.danger{background:var(--blood);color:#fff}
input,select{font:inherit;color:var(--text);background:#142021;border:1px solid var(--line);border-radius:8px;padding:.6rem .75rem;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
.hidden{display:none!important}

/* Ana ekran */
#home{min-height:100vh;display:grid;place-items:center;padding:1.25rem}
.invite{background:var(--paper);color:var(--ink);width:min(440px,100%);padding:2rem 1.75rem;border-radius:6px;
  box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--candle),0 24px 50px rgba(0,0,0,.5);position:relative}
.invite h1{font-size:2.3rem;line-height:1.05;margin-bottom:.35rem}
.invite p.sub{color:#5b4c3a;margin-bottom:1.4rem}
.invite label{display:block;font-weight:600;font-size:.9rem;margin:.9rem 0 .3rem}
.invite input{background:#fbf6ea;color:var(--ink);border-color:#cdbf9f}
.invite .row{display:flex;gap:.6rem}
.invite .row input{flex:1}
.invite button.main{background:var(--ink);color:var(--paper);width:100%;margin-top:1rem}
.invite button.alt{background:var(--blood);color:#fff}
.invite hr{border:0;border-top:1px dashed #b9a982;margin:1.4rem 0 .2rem}
.err{background:#f3d3cd;color:#7a1c12;border-radius:6px;padding:.6rem .8rem;margin-top:1rem;font-size:.9rem}
.roles-hint{margin-top:1.3rem;font-size:.85rem;color:#5b4c3a;display:grid;gap:.25rem}

/* Oda */
#room{max-width:1040px;margin:0 auto;padding:1rem}
.top{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.6rem .9rem;background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin-bottom:1rem}
.top .code{font-family:Georgia,serif;font-size:1.25rem;letter-spacing:.2em;color:var(--candle);cursor:pointer}
.top .phase{flex:1;color:var(--mute)}
.top #timer{font:700 1.3rem Georgia,serif;min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:.15rem .6rem;border-radius:99px;font-size:.85rem;font-weight:700;border:1px solid currentColor}
.chip.innocent{color:var(--sage)}.chip.killer{color:var(--blood)}.chip.neutral{color:var(--joker)}
.layout{display:grid;grid-template-columns:1fr 340px;gap:1rem;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:1.1rem}
.card h2{font-size:1.4rem;margin-bottom:.5rem}
.muted{color:var(--mute)}
.ann{background:#142021;border-left:3px solid var(--candle);padding:.7rem .9rem;border-radius:0 8px 8px 0;margin:.5rem 0 1rem}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem;margin:.6rem 0}
.pl{background:#142021;border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem;display:flex;flex-direction:column;gap:.15rem;font-size:.95rem;overflow:hidden;text-overflow:ellipsis}
.pl.dead{opacity:.5;text-decoration:line-through}
.pl small{text-decoration:none;display:block}
.pl.win{border-color:var(--candle);box-shadow:inset 0 0 0 1px var(--candle)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.55rem;margin:.7rem 0}
.tg{background:#142021;color:var(--text);border:1px solid var(--line);padding:.8rem .5rem}
.tg.sel{background:var(--blood);border-color:var(--blood);color:#fff}
.tg.selv{background:var(--candle);color:var(--ink);border-color:var(--candle)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem;margin:.8rem 0}
.settings label{font-size:.85rem;color:var(--mute);display:grid;gap:.25rem}

/* Rol kartı */
.rolecard{background:var(--paper);color:var(--ink);border-radius:6px;padding:1.6rem 1.4rem;text-align:center;max-width:360px;margin:.6rem auto 1rem;
  box-shadow:0 0 0 5px var(--bg2),0 0 0 6px var(--candle),0 18px 40px rgba(0,0,0,.45)}
.rolecard .ic{font-size:3rem}
.rolecard h2{font-size:2rem;margin:.2rem 0}
.rolecard.killer h2{color:#a3271d}.rolecard.neutral h2{color:#9a6310}.rolecard.innocent h2{color:#2e6b4c}
.rolecard p{font-size:.95rem}
.banner{text-align:center;padding:1rem;margin-bottom:.7rem}
.banner h2{font-size:1.9rem}

/* Sohbet */
.chat{display:flex;flex-direction:column;height:380px}
@media(max-width:820px){.chat{height:300px}}
#chatlog{flex:1;overflow-y:auto;font-size:.92rem;display:flex;flex-direction:column;gap:.3rem;padding-right:.3rem}
#chatlog .m b{color:var(--candle)}
#chatlog .m.sys{color:var(--mute);font-style:italic}
#chatlog .m.dead{color:#8aa0b8}
#chatlog .m.killer{color:#e08a82}
.chatin{display:flex;gap:.5rem;margin-top:.6rem}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,20px);background:var(--paper);color:var(--ink);padding:.6rem 1rem;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ANA EKRAN -->
<div id="home">
  <div class="invite">
    <h1>Köşkte Katil</h1>
    <p class="sub">Arkadaşlarınla online oyna: masumlar katili bulmaya, katil herkesi susturmaya çalışır.</p>

    <div id="err" class="err hidden"></div>
    <label for="name">Adın</label>
    <input id="name" maxlength="14" placeholder="Takma adını yaz" autocomplete="off">

    <button class="main alt" id="btnCreate">Oda kur</button>

    <hr>
    <label for="code">Oda kodu</label>
    <div class="row">
      <input id="code" maxlength="5" placeholder="ABCDE" autocomplete="off" style="text-transform:uppercase;letter-spacing:.25em;text-align:center">
    </div>
    <button class="main" id="btnJoin">Odaya katıl</button>

    <div class="roles-hint">
      <span><b>Masum:</b> katili oylayarak bul.</span>
      <span><b>Katil:</b> her gece birini öldür.</span>
      <span><b>Tarafsız:</b> kendi planıyla kazanır.</span>
    </div>
  </div>
</div>

<!-- ODA -->
<div id="room" class="hidden">
  <div class="top">
    <span>Oda</span><span class="code" id="roomCode" title="Davet bağlantısını kopyala"></span>
    <span class="phase" id="phaseLabel"></span>
    <span id="roleChip"></span>
    <span id="timer"></span>
    <button class="ghost" id="btnLeave">Çık</button>
  </div>
  <div class="layout">
    <section id="panel" class="card"></section>
    <section class="card chat">
      <h3 style="margin-bottom:.5rem">Sohbet</h3>
      <div id="chatlog"></div>
      <div class="chatin">
        <input id="chatin" maxlength="200" placeholder="Mesaj yaz" autocomplete="off">
        <button id="chatsend">Gönder</button>
      </div>
    </section>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(!window.Peer){document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');}</script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLE = {
  innocent:{n:'Masum', ic:'🙂'},
  killer:{n:'Katil', ic:'🔪'},
  neutral:{n:'Tarafsız', ic:'🃏'}
};
const PREFIX = 'koskteKatil-';
const DEF = {killers:1, neutrals:1, nightTime:25, discussTime:90, voteTime:30, neutralWin:'voted', reveal:true};

let peer = null, isHost = false, conns = {}, hostConn = null, G = null, S = null, endAt = 0, inRoom = false;

function toast(m){
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200);
}
function showErr(m){ const e = $('#err'); if(e){ e.textContent = m; e.classList.remove('hidden'); } toast(m); }
window.addEventListener('error', ev => { showErr('Hata: ' + (ev.message || 'bilinmeyen')); $('#btnCreate').disabled = false; $('#btnJoin').disabled = false; });
function needPeer(){
  if(typeof Peer === 'undefined'){
    showErr('PeerJS kütüphanesi yüklenemedi. İnternet bağlantını kontrol et. Dosyayı Claude önizlemesinde değil, kendi tarayıcında (veya GitHub Pages üzerinden) aç.');
    return false;
  }
  return true;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function genCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function getName(){
  const n = $('#name').value.trim().slice(0,14);
  if(!n){ toast('Önce bir ad yaz.'); $('#name').focus(); return null; }
  try{ localStorage.setItem('kk_name', n); }catch(e){}
  return n;
}

/* ===================== HOST (oda sahibi sunucu görevi görür) ===================== */
function freshGame(code){
  return {code, phase:'lobby', players:[], settings:{...DEF}, chat:[], round:0, ann:'', detail:[],
          endsAt:0, timer:null, next:null, nightVotes:{}, votes:{}, skip:new Set(), winner:null};
}
const byId = id => G.players.find(p => p.id === id);
function pushChat(c){ G.chat.push(c); if(G.chat.length > 100) G.chat.shift(); }
function sys(t){ pushChat({from:'Sistem', text:t, ch:'all', sys:true}); }

function sanitize(x){
  const o = {}, cl = (v,a,b) => Math.min(b, Math.max(a, parseInt(v) || a));
  if('killers' in x) o.killers = cl(x.killers,1,3);
  if('neutrals' in x) o.neutrals = cl(x.neutrals,0,2);
  if('nightTime' in x) o.nightTime = cl(x.nightTime,10,90);
  if('discussTime' in x) o.discussTime = cl(x.discussTime,20,300);
  if('voteTime' in x) o.voteTime = cl(x.voteTime,10,120);
  if('neutralWin' in x && ['voted','survive'].includes(x.neutralWin)) o.neutralWin = x.neutralWin;
  if('reveal' in x) o.reveal = (x.reveal === true || x.reveal === 'true');
  return o;
}

function setPhase(ph, sec, fn){
  clearTimeout(G.timer); G.phase = ph; G.next = fn;
  if(sec){ G.endsAt = Date.now() + sec*1000; G.timer = setTimeout(finishPhase, sec*1000); }
  else { G.endsAt = 0; G.timer = null; }
  broadcast();
}
function finishPhase(){ clearTimeout(G.timer); const f = G.next; G.next = null; if(f) f(); }

function startGame(){
  const n = G.players.length, s = G.settings;
  if(n < 4) return toast('En az 4 oyuncu gerekli.');
  if(s.killers*2 >= n) return toast('Katil sayısı bu oyuncu sayısı için fazla.');
  if(s.killers + s.neutrals > n - 2) return toast('Katil + tarafsız sayısı çok fazla.');
  const roles = [...Array(s.killers).fill('killer'), ...Array(s.neutrals).fill('neutral')];
  while(roles.length < n) roles.push('innocent');
  shuffle(roles);
  G.players.forEach((p,i) => { p.role = roles[i]; p.alive = true; });
  G.round = 0; G.chat = []; G.winner = null; G.ann = ''; G.detail = [];
  sys('Oyun başladı. Köşkte bir katil var...');
  setPhase('role', 8, startNight);
}
function startNight(){
  G.round++; G.nightVotes = {}; G.skip = new Set(); G.ann = ''; G.detail = [];
  setPhase('night', G.settings.nightTime, endNight);
}
function endNight(){
  const t = {}; Object.values(G.nightVotes).forEach(x => t[x] = (t[x]||0) + 1);
  let m = 0, top = [];
  for(const k in t){ if(t[k] > m){ m = t[k]; top = [k]; } else if(t[k] === m) top.push(k); }
  let msg = 'Sabah oldu. Gece kimse ölmedi.';
  if(top.length){
    const p = byId(top[Math.floor(Math.random()*top.length)]);
    if(p && p.alive){
      p.alive = false;
      msg = `Sabah oldu. ${p.name} ölü bulundu!` + (G.settings.reveal ? ` (Rolü: ${ROLE[p.role].n})` : '');
    }
  }
  G.ann = msg; sys(msg);
  if(checkWin()) return;
  startDiscuss();
}
function startDiscuss(){ G.skip = new Set(); setPhase('discuss', G.settings.discussTime, startVote); }
function startVote(){ G.votes = {}; setPhase('vote', G.settings.voteTime, endVote); }
function endVote(){
  const t = {}; Object.values(G.votes).forEach(x => t[x] = (t[x]||0) + 1);
  let m = 0, top = [];
  for(const k in t){ if(t[k] > m){ m = t[k]; top = [k]; } else if(t[k] === m) top.push(k); }
  let msg, out = null;
  if(top.length === 1 && top[0] !== 'skip'){
    out = byId(top[0]); out.alive = false;
    msg = `Oylama sonucu ${out.name} köşkten atıldı (${m} oy).` + (G.settings.reveal ? ` Rolü: ${ROLE[out.role].n}.` : '');
  } else {
    msg = m === 0 ? 'Kimse oy kullanmadı. Kimse elenmedi.' : 'Oylar eşit çıktı ya da pas geçildi. Kimse elenmedi.';
  }
  G.detail = Object.entries(G.votes).map(([v,tg]) => `${byId(v).name} → ${tg === 'skip' ? 'Pas' : byId(tg).name}`);
  G.ann = msg; sys(msg);
  if(out && out.role === 'neutral' && G.settings.neutralWin === 'voted') return endGame('neutral', [out.id]);
  if(checkWin()) return;
  setPhase('result', 8, startNight);
}
function checkWin(){
  const a = G.players.filter(p => p.alive), k = a.filter(p => p.role === 'killer').length;
  if(k === 0) return endGame('innocent');
  if(k >= a.length - k) return endGame('killer');
  return false;
}
function endGame(team, ids){
  clearTimeout(G.timer);
  const surv = G.settings.neutralWin === 'survive';
  const w = ids || G.players.filter(p =>
    (team === 'innocent' && p.role === 'innocent') ||
    (team === 'killer' && p.role === 'killer') ||
    (surv && p.role === 'neutral' && p.alive)).map(p => p.id);
  G.winner = {team, ids:w};
  G.ann = team === 'innocent' ? 'Masumlar kazandı! Tüm katiller ele geçirildi.'
        : team === 'killer' ? 'Katiller kazandı! Köşk onların oldu.'
        : 'Tarafsız kazandı! Herkesi kandırdı.';
  sys(G.ann);
  G.phase = 'end'; G.endsAt = 0; G.next = null;
  broadcast();
  return true;
}
function resetLobby(){
  G.players = G.players.filter(p => !p.left);
  G.players.forEach(p => { p.role = null; p.alive = true; });
  G.chat = []; G.phase = 'lobby'; G.winner = null; G.ann = ''; G.detail = []; G.endsAt = 0; G.round = 0;
  broadcast();
}
function maybeAdvance(){
  const al = G.players.filter(p => p.alive);
  if(G.phase === 'night'){
    const ks = al.filter(p => p.role === 'killer');
    if(ks.length && ks.every(k => G.nightVotes[k.id])) finishPhase();
  } else if(G.phase === 'vote'){
    if(al.length && al.every(p => G.votes[p.id])) finishPhase();
  }
}
function chanFor(p){
  if(G.phase === 'lobby' || G.phase === 'end') return 'all';
  if(!p.alive) return 'dead';
  if(G.phase === 'night') return p.role === 'killer' ? 'killer' : null;
  if(G.phase === 'role') return null;
  return 'all';
}
function viewFor(p){
  const end = G.phase === 'end', inGame = G.phase !== 'lobby';
  const al = G.players.filter(x => x.alive);
  const skipCount = al.filter(x => G.skip.has(x.id)).length;
  const v = {
    phase:G.phase, code:G.code, settings:G.settings, round:G.round,
    left:G.endsAt ? Math.max(0, G.endsAt - Date.now()) : 0,
    ann:G.ann, detail:G.phase === 'result' ? G.detail : [], winner:G.winner,
    me:{id:p.id, role:inGame ? p.role : null, alive:p.alive, host:p.host},
    players:G.players.map(q => ({
      id:q.id, name:q.name, alive:q.alive, host:q.host, left:!!q.left,
      role:(inGame && (end || q.id === p.id || (p.role === 'killer' && q.role === 'killer') || (!q.alive && G.settings.reveal))) ? q.role : null
    })),
    chan:chanFor(p),
    chat:G.chat.filter(c => c.ch === 'all' || (c.ch === 'dead' && (!p.alive || end)) || (c.ch === 'killer' && p.role === 'killer')),
    myPick:G.nightVotes[p.id] || null, myVote:G.votes[p.id] || null,
    picks:p.role === 'killer' ? Object.entries(G.nightVotes).map(([k,t]) => ({by:byId(k).name, to:byId(t).name})) : [],
    voted:Object.keys(G.votes).filter(k => byId(k) && byId(k).alive).length, aliveN:al.length,
    skipCount, skipNeed:Math.floor(al.length/2) + 1, iSkipped:G.skip.has(p.id)
  };
  return v;
}
function broadcast(){
  if(!G) return;
  G.players.forEach(p => {
    if(p.id === 'host') render(viewFor(p));
    else { const c = conns[p.id]; if(c && c.open){ try{ c.send({t:'state', s:viewFor(p)}); }catch(e){} } }
  });
}
function handle(id, m){
  const p = byId(id); if(!p || !m) return;
  switch(m.t){
    case 'chat': {
      const text = String(m.text || '').trim().slice(0,200); if(!text) return;
      const ch = chanFor(p); if(!ch) return;
      pushChat({from:p.name, text, ch}); broadcast(); break;
    }
    case 'night': {
      if(G.phase !== 'night' || !p.alive || p.role !== 'killer') return;
      const t = byId(m.target); if(!t || !t.alive || t.role === 'killer') return;
      G.nightVotes[id] = t.id; broadcast(); maybeAdvance(); break;
    }
    case 'vote': {
      if(G.phase !== 'vote' || !p.alive) return;
      if(m.target !== 'skip'){ const t = byId(m.target); if(!t || !t.alive || t.id === id) return; }
      G.votes[id] = m.target; broadcast(); maybeAdvance(); break;
    }
    case 'skip': {
      if(G.phase !== 'discuss' || !p.alive) return;
      G.skip.add(id);
      const need = Math.floor(G.players.filter(x => x.alive).length/2) + 1;
      if(G.players.filter(x => x.alive && G.skip.has(x.id)).length >= need) finishPhase(); else broadcast();
      break;
    }
    case 'settings': if(id === 'host' && G.phase === 'lobby'){ Object.assign(G.settings, sanitize(m.s)); broadcast(); } break;
    case 'start': if(id === 'host' && G.phase === 'lobby') startGame(); break;
    case 'reset': if(id === 'host' && G.phase === 'end') resetLobby(); break;
  }
}
function onLeave(id){
  const p = byId(id); if(!p) return;
  delete conns[id];
  if(G.phase === 'lobby'){ G.players = G.players.filter(x => x.id !== id); broadcast(); return; }
  p.left = true;
  if(p.alive && G.phase !== 'end'){
    p.alive = false; sys(`${p.name} oyundan ayrıldı.`);
    if(checkWin()) return;
    broadcast(); maybeAdvance();
  } else broadcast();
}
function addPlayer(id, name){
  let n = name, i = 2; while(G.players.some(p => p.name.toLowerCase() === n.toLowerCase())) n = name.slice(0,12) + ' ' + (i++);
  G.players.push({id, name:n, alive:true, role:null, host:false});
}
function onConnection(c){
  c.on('data', d => {
    if(!d) return;
    if(d.t === 'join'){
      if(conns[c.peer]) return;
      if(G.phase !== 'lobby'){ c.send({t:'err', m:'Bu odada oyun çoktan başlamış.'}); setTimeout(() => c.close(), 300); return; }
      if(G.players.length >= 12){ c.send({t:'err', m:'Oda dolu (en fazla 12 oyuncu).'}); setTimeout(() => c.close(), 300); return; }
      conns[c.peer] = c;
      addPlayer(c.peer, String(d.name || 'Oyuncu').slice(0,14));
      sys(`${byId(c.peer).name} odaya katıldı.`);
      broadcast();
    } else if(conns[c.peer] === c) handle(c.peer, d);
  });
  c.on('close', () => { if(conns[c.peer] === c) onLeave(c.peer); });
  c.on('error', () => {});
}

function createRoom(){
  const name = getName(); if(!name) return;
  if(!needPeer()) return;
  $('#err').classList.add('hidden');
  $('#btnCreate').disabled = true;
  let opened = false;
  const guard = setTimeout(() => {
    if(!opened){
      showErr('Oda sunucusuna bağlanılamadı. İnternetini kontrol et; okul/kurum ağı ya da önizleme penceresi bağlantıyı engelliyor olabilir.');
      $('#btnCreate').disabled = false;
      try{ peer && peer.destroy(); }catch(e){}
    }
  }, 12000);
  (function tryCreate(){
    const code = genCode();
    const p = new Peer(PREFIX + code);
    peer = p;
    p.on('open', () => {
      opened = true; clearTimeout(guard);
      peer = p; isHost = true; G = freshGame(code);
      G.players.push({id:'host', name, alive:true, role:null, host:true});
      sys('Oda kuruldu. Arkadaşlarına oda kodunu ver.');
      p.on('connection', onConnection);
      p.on('disconnected', () => { try{ p.reconnect(); }catch(e){} });
      $('#btnCreate').disabled = false;
      location.hash = code;
      broadcast();
    });
    p.on('error', e => {
      if(e.type === 'unavailable-id'){ p.destroy(); tryCreate(); }
      else if(!inRoom){ clearTimeout(guard); showErr('Bağlantı kurulamadı (' + e.type + '). İnterneti kontrol et.'); $('#btnCreate').disabled = false; }
    });
  })();
}

/* ===================== İSTEMCİ ===================== */
function joinRoom(){
  const name = getName(); if(!name) return;
  const code = $('#code').value.trim().toUpperCase();
  if(code.length !== 5){ toast('Oda kodu 5 karakterli olmalı.'); $('#code').focus(); return; }
  if(!needPeer()) return;
  $('#err').classList.add('hidden');
  $('#btnJoin').disabled = true;
  let done = false;
  const fail = m => { if(done) return; done = true; showErr(m); $('#btnJoin').disabled = false; leaveRoom(true); };
  peer = new Peer();
  peer.on('open', () => {
    hostConn = peer.connect(PREFIX + code, {reliable:true});
    hostConn.on('open', () => { hostConn.send({t:'join', name}); });
    hostConn.on('data', d => {
      if(d.t === 'state'){ done = true; $('#btnJoin').disabled = false; render(d.s); }
      else if(d.t === 'err'){ fail(d.m); }
    });
    hostConn.on('close', () => { if(inRoom){ toast('Oda kapandı ya da bağlantı koptu.'); leaveRoom(true); } });
    setTimeout(() => fail('Odaya bağlanılamadı. Kodu kontrol et.'), 12000);
  });
  peer.on('error', e => {
    if(e.type === 'peer-unavailable') fail('Böyle bir oda bulunamadı.');
    else if(!inRoom) fail('Bağlantı hatası: ' + e.type);
  });
}

function send(m){
  if(isHost) handle('host', m);
  else if(hostConn && hostConn.open) hostConn.send(m);
}
function leaveRoom(silent){
  inRoom = false;
  try{ if(G && G.timer) clearTimeout(G.timer); }catch(e){}
  try{ peer && peer.destroy(); }catch(e){}
  peer = null; isHost = false; conns = {}; hostConn = null; G = null; S = null; endAt = 0;
  $('#room').classList.add('hidden'); $('#home').classList.remove('hidden');
  history.replaceState(null, '', location.pathname);
}

/* ===================== ARAYÜZ ===================== */
const PH = {lobby:'Lobi', role:'Rolün', discuss:'Tartışma', vote:'Oylama', result:'Sonuç', end:'Oyun bitti'};
function plist(s, opt = {}){
  return '<div class="plist">' + s.players.map(p => {
    const alive = p.alive !== false && !p.left;
    const r = p.role ? `<small class="chip ${p.role}" style="align-self:flex-start">${ROLE[p.role].ic} ${ROLE[p.role].n}</small>` : '';
    const win = s.winner && s.winner.ids.includes(p.id);
    return `<div class="pl ${alive ? '' : 'dead'} ${win ? 'win' : ''}"><span>${esc(p.name)}${p.host ? ' 👑' : ''}${p.id === s.me.id ? ' (sen)' : ''}${win ? ' 🏆' : ''}</span>${r}</div>`;
  }).join('') + '</div>';
}
function targets(s, kind, sel){
  const list = s.players.filter(p => p.alive && !p.left && p.id !== s.me.id && !(kind === 'night' && p.role === 'killer'));
  return '<div class="grid">' + list.map(p =>
    `<button class="tg ${sel === p.id ? (kind === 'night' ? 'sel' : 'selv') : ''}" onclick="act('${kind}','${p.id}')">${esc(p.name)}</button>`).join('') + '</div>';
}
function roleDesc(s){
  const r = s.me.role, w = s.settings.neutralWin;
  if(r === 'innocent') return 'Masumsun. Tartışmada katilleri bul ve oylayarak köşkten at.';
  if(r === 'killer'){
    const al = s.players.filter(p => p.role === 'killer' && p.id !== s.me.id).map(p => esc(p.name));
    return 'Katilsin. Her gece bir kurban seç; sayıca masumlara yetişirsen kazanırsın.' + (al.length ? `<br><b>Ortağın:</b> ${al.join(', ')}` : '');
  }
  return w === 'voted'
    ? 'Tarafsızsın. Gündüz oylamasında köşkten atılırsan tek başına kazanırsın. Şüpheli görün ama fazla belli etme.'
    : 'Tarafsızsın. Oyun bittiğinde hayatta olursan kazanan tarafla birlikte kazanırsın.';
}
function settingsHTML(s){
  const st = s.settings, h = s.me.host;
  const sel = (k, opts, fmt) => `<select ${h ? '' : 'disabled'} onchange="setSet('${k}',this.value)">` +
    opts.map(o => `<option value="${o}" ${String(st[k]) === String(o) ? 'selected' : ''}>${fmt ? fmt(o) : o}</option>`).join('') + '</select>';
  const sn = o => o + ' sn';
  return `<div class="settings">
    <label>Katil sayısı ${sel('killers',[1,2,3])}</label>
    <label>Tarafsız sayısı ${sel('neutrals',[0,1,2])}</label>
    <label>Gece süresi ${sel('nightTime',[15,20,25,30,45,60],sn)}</label>
    <label>Tartışma süresi ${sel('discussTime',[30,60,90,120,180],sn)}</label>
    <label>Oylama süresi ${sel('voteTime',[15,20,30,45,60],sn)}</label>
    <label>Tarafsız nasıl kazanır? ${sel('neutralWin',['voted','survive'],o => o === 'voted' ? 'Oylanıp atılırsa' : 'Sona kadar hayatta kalırsa')}</label>
    <label>Elenenin rolü açıklansın mı? ${sel('reveal',['true','false'],o => o === 'true' ? 'Evet' : 'Hayır')}</label>
  </div>
  <p class="muted" style="font-size:.85rem">Kalan oyuncular masum olur. ${h ? '' : 'Ayarları yalnızca oda sahibi değiştirir.'}</p>`;
}
function panelHTML(s){
  const dead = !s.me.alive;
  switch(s.phase){
    case 'lobby': {
      const n = s.players.length;
      return `<h2>Lobi</h2>
        <p class="muted">Oda kodu <b style="color:var(--candle);letter-spacing:.2em">${esc(s.code)}</b>. Arkadaşların kodu yazarak katılır. Oyuncular: ${n}/12 (en az 4)</p>
        ${plist(s)}
        <h3 style="margin-top:1rem">Oyun ayarları</h3>
        ${settingsHTML(s)}
        ${s.me.host ? `<button onclick="send({t:'start'})" ${n < 4 ? 'disabled' : ''}>Oyunu başlat</button>
          <button class="ghost" onclick="copyLink()">Davet bağlantısını kopyala</button>`
          : '<p class="muted">Oda sahibi oyunu başlatınca rolün gösterilecek.</p>'}`;
    }
    case 'role': {
      const r = s.me.role;
      return `<h2>Rolün</h2><div class="rolecard ${r}"><div class="ic">${ROLE[r].ic}</div><h2>${ROLE[r].n}</h2><p>${roleDesc(s)}</p></div>
        <p class="muted" style="text-align:center">İlk gece birazdan başlıyor.</p>`;
    }
    case 'night': {
      if(dead) return `<h2>Gece ${s.round}</h2><p class="muted">Öldün. Hayaletlerle sohbet edebilir, oyunu izleyebilirsin.</p>${plist(s)}`;
      if(s.me.role === 'killer'){
        const picks = s.picks && s.picks.length ? '<p class="muted">' + s.picks.map(x => `${esc(x.by)} → ${esc(x.to)}`).join('<br>') + '</p>' : '';
        return `<h2>Gece ${s.round}: kurbanını seç</h2><p class="muted">Seçimini zaman dolmadan değiştirebilirsin. Ortağınla katil kanalından konuş.</p>${targets(s,'night',s.myPick)}${picks}`;
      }
      return `<h2>Gece ${s.round}</h2><p class="muted">Köşk sessiz... Herkes odasında. Katil iş başında.</p>${plist(s)}`;
    }
    case 'discuss':
      return `<h2>Tartışma</h2>${s.ann ? `<div class="ann">${esc(s.ann)}</div>` : ''}
        <p class="muted">Kim şüpheli? Sohbette konuş, sonra oylamaya geçin.</p>${plist(s)}
        ${dead ? '' : `<button class="ghost" onclick="send({t:'skip'})" ${s.iSkipped ? 'disabled' : ''}>Oylamaya geç (${s.skipCount}/${s.skipNeed})</button>`}`;
    case 'vote':
      return `<h2>Oylama</h2>${dead ? '<p class="muted">Öldüğün için oy kullanamazsın.</p>' + plist(s)
        : `<p class="muted">Kimi köşkten atacaksınız? (${s.voted}/${s.aliveN} oy kullandı)</p>${targets(s,'vote',s.myVote)}
        <button class="tg ${s.myVote === 'skip' ? 'selv' : 'ghost'}" onclick="act('vote','skip')">Pas geç</button>`}`;
    case 'result':
      return `<h2>Oylama sonucu</h2><div class="ann">${esc(s.ann)}</div>
        ${s.detail.length ? '<p class="muted">' + s.detail.map(esc).join('<br>') + '</p>' : ''}${plist(s)}
        <p class="muted">Gece birazdan başlıyor.</p>`;
    case 'end': {
      const w = s.winner;
      return `<div class="banner"><h2>${esc(s.ann)}</h2></div>
        <p class="muted">Kazananlar 🏆 ile işaretli. Tüm roller açıldı.</p>${plist(s)}
        ${s.me.host ? `<button onclick="send({t:'reset'})">Lobiye dön</button>` : '<p class="muted">Oda sahibi lobiye dönünce yeni oyun kurulur.</p>'}`;
    }
  }
  return '';
}
function render(s){
  S = s; inRoom = true;
  $('#home').classList.add('hidden'); $('#room').classList.remove('hidden');
  $('#roomCode').textContent = s.code;
  $('#phaseLabel').textContent = s.phase === 'night' ? 'Gece ' + s.round : PH[s.phase];
  $('#roleChip').innerHTML = s.me.role ? `<span class="chip ${s.me.role}">${ROLE[s.me.role].ic} ${ROLE[s.me.role].n}${s.me.alive ? '' : ' 💀'}</span>` : '';
  endAt = s.left ? Date.now() + s.left : 0;
  tick();
  $('#panel').innerHTML = panelHTML(s);

  const log = $('#chatlog'), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  log.innerHTML = s.chat.map(c => {
    if(c.sys) return `<div class="m sys">${esc(c.text)}</div>`;
    const tag = c.ch === 'dead' ? '👻 ' : c.ch === 'killer' ? '🔪 ' : '';
    return `<div class="m ${c.ch}">${tag}<b>${esc(c.from)}:</b> ${esc(c.text)}</div>`;
  }).join('');
  if(atBottom) log.scrollTop = log.scrollHeight;

  const inp = $('#chatin');
  inp.disabled = !s.chan; $('#chatsend').disabled = !s.chan;
  inp.placeholder = s.chan === 'dead' ? 'Sadece ölüler görür' : s.chan === 'killer' ? 'Katil kanalı (sadece katiller görür)' : s.chan ? 'Mesaj yaz' : 'Şu an konuşamazsın';
}
function tick(){
  const el = $('#timer');
  if(!endAt){ el.textContent = ''; return; }
  const sec = Math.max(0, Math.ceil((endAt - Date.now())/1000));
  el.textContent = Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
}
setInterval(tick, 250);

function act(kind, target){
  if(kind === 'night') send({t:'night', target});
  else if(kind === 'vote') send({t:'vote', target});
}
function setSet(k, v){ send({t:'settings', s:{[k]:v}}); }
function copyLink(){
  const link = location.href.split('#')[0] + '#' + (S ? S.code : '');
  if(navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('Davet bağlantısı kopyalandı.'), () => toast(link));
  else toast(link);
}
function sendChat(){
  const i = $('#chatin'), t = i.value.trim(); if(!t) return;
  send({t:'chat', text:t}); i.value = '';
}

/* Olaylar */
$('#btnCreate').onclick = createRoom;
$('#btnJoin').onclick = joinRoom;
$('#btnLeave').onclick = () => { if(confirm('Odadan çıkmak istiyor musun?' + (isHost ? ' Oda kapanır.' : ''))) leaveRoom(); };
$('#chatsend').onclick = sendChat;
$('#chatin').addEventListener('keydown', e => { if(e.key === 'Enter') sendChat(); });
$('#code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
$('#code').addEventListener('keydown', e => { if(e.key === 'Enter') joinRoom(); });
$('#name').addEventListener('keydown', e => { if(e.key === 'Enter') ($('#code').value ? joinRoom() : createRoom()); });
$('#roomCode').onclick = copyLink;
window.addEventListener('beforeunload', () => { try{ peer && peer.destroy(); }catch(e){} });

/* Başlangıç: kayıtlı ad ve bağlantıdaki oda kodu */
try{ const n = localStorage.getItem('kk_name'); if(n) $('#name').value = n; }catch(e){}
const h = location.hash.replace('#','').toUpperCase();
if(/^[A-Z0-9]{5}$/.test(h)) $('#code').value = h;
</script>
